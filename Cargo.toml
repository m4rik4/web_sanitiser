[package]
name = "web-sanitiser"
version = "0.1.0"
edition = "2021"
authors = [
    "Filippo Barboni <s352701@studenti.polito.it>",
    "Marika Fuccio <s354828@studenti.polito.it>",
    "Alessio Belluardo <s359092@studenti.polito.it>",
]
description = "utility difensiva in rust che ispeziona contenuto web non fidato, ne neutralizza le parti pericolose e produce un report json"

# la libreria contiene il motore, il binario è la cli che lo usa (traccia sez. 6)
[lib]
name = "web_sanitiser"  # underscore, è il nome che si scrive nel codice
path = "src/lib.rs"

[[bin]]
name = "web-sanitiser"  # trattino, è il nome che si digita da terminale
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] } # derive per serializzare le nostre struct
serde_json = "1" # lettura e scrittura json
url = "2" # parsing degli url
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] } # client http, rustls al posto di openssl

# build ottimizzata, usata per le misure di performance
[profile.release]
opt-level = 3
lto = true
