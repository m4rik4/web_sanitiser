[package]
name = "web-sanitiser"
version = "0.1.0"
edition = "2021"
authors = [
    "Filippo Barboni <s352701@studenti.polito.it>",
    "Marika Fuccio <s354828@studenti.polito.it>",
    "Alessio Belluardo <s359092@studenti.polito.it>",
]
description = "utility difensiva in rust che ispeziona contenuto web non fidato, ne neutralizza le parti pericolose e produce un report json"

# la libreria contiene il motore, il binario è la cli che lo usa (traccia sez. 6)
[lib]
name = "web_sanitiser"  # underscore, è il nome che si scrive nel codice
path = "src/lib.rs"

[[bin]]
name = "web-sanitiser"  # trattino, è il nome che si digita da terminale
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] } # definizione degli argomenti da riga di comando
serde = { version = "1", features = ["derive"] } # derive Serialize e Deserialize sulle nostre struct
serde_json = "1" # lettura e scrittura json
url = "2" # parsing degli url
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"] } # runtime async che ospita le chiamate di rete
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] } # client http che usa rustls invece di openssl e decomprime da solo le risposte gzip
imagesize = "0.15.0" # dimensioni di un'immagine dalla sua intestazione, senza decodificarla
lol_html = "1.2" # riscrittura dell'html in streaming, senza costruire l'albero dom

# build ottimizzata, usata per le misure di performance
[profile.release]
opt-level = 3
lto = true
